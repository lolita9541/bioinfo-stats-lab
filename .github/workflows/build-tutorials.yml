name: Build tutorial pages

on:
  push:
    branches: [main]
    paths:
      - 'content/tutorials/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build tutorial index and pages
        run: python scripts/build_content.py

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/tutorials/index.json tutorials/
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "Auto-build tutorial pages"
            git push
          fi
