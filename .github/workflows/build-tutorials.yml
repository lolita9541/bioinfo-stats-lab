name: Build CMS content

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'scripts/build_content.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install content builder dependencies
        run: pip install pyyaml markdown

      - name: Build CMS indexes and tutorial pages
        run: python scripts/build_content.py

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/tutorials/index.json content/research/index.json content/services/index.json content/site/about.json tutorials/
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "Auto-build CMS content"
            git push
          fi
