backend:
  name: github
  repo: lolita9541/bioinfo-stats-lab
  branch: main

site_url: https://brilliant-kringle-39b162.netlify.app
display_url: https://brilliant-kringle-39b162.netlify.app

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "site"
    label: "網站基本資料 Site"
    files:
      - name: "about"
        label: "關於我 About Me"
        file: "content/site/about.yml"
        fields:
          - {label: "中文主標題", name: "headline_zh", widget: "string"}
          - {label: "English Headline", name: "headline_en", widget: "string"}
          - {label: "中文介紹第一段", name: "intro1_zh", widget: "text"}
          - {label: "English Intro 1", name: "intro1_en", widget: "text"}
          - {label: "中文介紹第二段", name: "intro2_zh", widget: "text"}
          - {label: "English Intro 2", name: "intro2_en", widget: "text"}
          - label: "特色 Highlights"
            name: "highlights"
            widget: "list"
            fields:
              - {label: "Icon", name: "icon", widget: "string", default: "✦"}
              - {label: "中文標題", name: "title_zh", widget: "string"}
              - {label: "English Title", name: "title_en", widget: "string"}
              - {label: "中文說明", name: "description_zh", widget: "text"}
              - {label: "English Description", name: "description_en", widget: "text"}

  - name: "tutorials"
    label: "教學資源 Tutorials"
    folder: "content/tutorials"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "中文標題", name: "title_zh", widget: "string"}
      - {label: "English Title", name: "title_en", widget: "string", required: false}
      - {label: "分類", name: "category", widget: "select", options: ["Microbiome","Statistics","Bioinformatics","TCR","Multi-omics","Research Strategy"]}
      - {label: "發布日期", name: "date", widget: "datetime"}
      - {label: "摘要", name: "summary_zh", widget: "text", required: false}
      - {label: "Summary (EN)", name: "summary_en", widget: "text", required: false}
      - {label: "封面圖片", name: "image", widget: "image", required: false}
      - {label: "中文內容", name: "body", widget: "markdown"}
      - {label: "English Content", name: "body_en", widget: "markdown", required: false}

  - name: "research"
    label: "研究方向 Research"
    folder: "content/research"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "中文標題", name: "title_zh", widget: "string"}
      - {label: "English Title", name: "title_en", widget: "string"}
      - {label: "中文介紹", name: "description_zh", widget: "text"}
      - {label: "English Description", name: "description_en", widget: "text", required: false}
      - {label: "研究圖片", name: "image", widget: "image", required: false}
      - {label: "顯示順序", name: "order", widget: "number", default: 10, value_type: "int"}
      - {label: "詳細內容", name: "body", widget: "markdown", required: false}

  - name: "services"
    label: "服務項目 Services"
    folder: "content/services"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "中文名稱", name: "title_zh", widget: "string"}
      - {label: "English Name", name: "title_en", widget: "string"}
      - {label: "中文簡介", name: "description_zh", widget: "text"}
      - {label: "English Description", name: "description_en", widget: "text", required: false}
      - {label: "卡片色彩", name: "color", widget: "select", options: ["purple","blue","mint","pink"], default: "purple"}
      - {label: "Icon", name: "icon", widget: "string", default: "✦"}
      - label: "中文服務項目"
        name: "items_zh"
        widget: "list"
        field: {label: "項目", name: "item", widget: "string"}
      - label: "English Service Items"
        name: "items_en"
        widget: "list"
        required: false
        field: {label: "Item", name: "item", widget: "string"}
      - {label: "顯示順序", name: "order", widget: "number", default: 10, value_type: "int"}
      - {label: "詳細內容", name: "body", widget: "markdown", required: false}
